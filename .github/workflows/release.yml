name: Release

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Release name'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  ZIGLANG_VERSION: '0.17.1'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.name }}
        run: |
          tag=$(printf '%s' "$RELEASE_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//; s/-$//')
          if [ -z "$tag" ]; then
            echo "::error::Release name '$RELEASE_NAME' has no letters or digits to build a tag from"
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::error::Tag $tag already exists, pick another release name"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install zig
        run: python -m pip install "ziglang==$ZIGLANG_VERSION"

      - name: Build all platforms
        env:
          ZIG: python -m ziglang
        run: ./build-all.sh

      - name: Package
        run: |
          mkdir dist
          for dir in build/*/; do
            platform=$(basename "$dir")
            [ "$platform" = obj ] && continue
            ext=""
            [[ "$platform" == windows-* ]] && ext=".exe"
            # pfdtool reads global.conf / games.conf from the current directory, so they ship with it
            (cd "$dir" && zip -q "../../dist/pfdtool-${platform}.zip" "pfdtool${ext}" global.conf games.conf)
            (cd "$dir" && zip -q "../../dist/sfopatcher-${platform}.zip" "sfopatcher${ext}")
          done
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_NAME: ${{ inputs.name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --latest
